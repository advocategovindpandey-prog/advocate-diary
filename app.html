<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advocate Diary</title>
<link rel="manifest" href="manifest-app.webmanifest">
<meta name="theme-color" content="#1a0f0c">
<link rel="icon" href="icon-admin-192.png">
<link rel="apple-touch-icon" href="icon-admin-192.png">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a0f0c;font-family:system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;color:#142b4a;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.logo{display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:22px}
h1{font-size:19px;text-align:center;margin:0 0 4px}
p.sub{text-align:center;margin:0 0 16px;color:#64748b;font-size:13px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:11px;background:#142b4a;color:#fff;font-weight:800;font-size:16px}
#msg{margin-top:12px;font-size:13px;color:#b91c1c;text-align:center;min-height:18px}
#wait{text-align:center;color:#64748b}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon-admin-192.png" alt="">
  <h1>Advocate Diary</h1>
  <p class="sub">Master · Admin · User — एक ही लॉगिन</p>
  <div id="wait">जाँच रहे हैं…</div>
  <form id="f" style="display:none" autocomplete="on">
    <label for="em">User ID या Email</label>
    <input id="em" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button id="go" type="submit">लॉगिन</button>
  </form>
  <div id="msg"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { initializeFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg = { apiKey: 'AIzaSyBmHLu3JoX-CssXo_3m5yJrxkqD5rCV_U0', authDomain: 'advocate-diary-366f8.firebaseapp.com', projectId: 'advocate-diary-366f8', storageBucket: 'advocate-diary-366f8.firebasestorage.app', messagingSenderId: '982808690791', appId: '1:982808690791:web:fe644f22f4ddaf0fea14c2' };
const app = initializeApp(cfg), auth = getAuth(app), db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const PAGE = { master: 'master.html', admin: 'admin.html', user: 'user.html' };
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };
function showForm() { $('wait').style.display = 'none'; $('f').style.display = 'block'; }
async function go(u) {
  try {
    const d = await getDoc(doc(db, 'users', u.uid)); const r = d.exists() ? d.data().role : '';
    if (r) try { localStorage.setItem('advRoleHint', r); } catch (e) { }
    location.replace(PAGE[r] || PAGE[localStorage.getItem('advRoleHint')] || 'user.html');
  } catch (e) {
    const h = localStorage.getItem('advRoleHint'); if (h && PAGE[h]) { location.replace(PAGE[h]); return; }
    showForm(); msg('प्रोफ़ाइल नहीं मिली: ' + (e.code || e.message));
  }
}
onAuthStateChanged(auth, u => { if (u) go(u); else showForm(); });
$('f').addEventListener('submit', async ev => {
  ev.preventDefault(); msg(''); $('go').disabled = true;
  try {
    let e = $('em').value.trim(), p = $('pw').value; if (!e || !p) throw new Error('ID और पासवर्ड डालिए');
    if (e.indexOf('@') < 0) { const d = await getDoc(doc(db, 'ids', e.toLowerCase())); if (!d.exists()) throw new Error('यह User ID नहीं मिला'); e = d.data().email; }
    const cr = await signInWithEmailAndPassword(auth, e, p); await go(cr.user);
  } catch (err) { msg(({ 'auth/invalid-credential': 'ID या पासवर्ड गलत है', 'auth/wrong-password': 'पासवर्ड गलत है', 'auth/user-not-found': 'खाता नहीं मिला', 'auth/too-many-requests': 'बहुत कोशिशें — थोड़ी देर बाद' })[err.code] || err.message || String(err)); }
  $('go').disabled = false;
});
</script>
</body>
</html>
